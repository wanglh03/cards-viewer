<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>卡面图鉴</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/gallery.css" />
  </head>

  <body data-page="home">
    <div id="siteNav"></div>
    <header class="site-header">
      <section class="hero" id="top">
        <div>
          <h1>卡面图鉴</h1>
        </div>
        <div class="gallery-stats-group">
          <div class="gallery-stats" id="galleryStats" aria-live="polite"></div>
          <div
            class="gallery-file-stats"
            id="galleryFileStats"
            aria-live="polite"
          >
            文件大小统计中…
          </div>
        </div>
      </section>
    </header>

    <main class="layout gallery-layout">
      <section class="search-row" aria-label="搜索">
        <label class="search-box" for="gallerySearchInput">
          <span aria-hidden="true">⌕</span>
          <input
            id="gallerySearchInput"
            type="search"
            placeholder="搜索卡片、发行方或卡组织"
            autocomplete="off"
          />
        </label>
      </section>

      <section class="filter-row" aria-label="筛选">
        <div class="select-wrap issuer-filter" id="galleryIssuerFilterWrap">
          <span>发行方(分类)</span>
          <button
            class="issuer-filter-trigger"
            id="galleryIssuerFilterTrigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span id="galleryIssuerFilterLabel">全部</span>
          </button>
          <div class="issuer-filter-panel" id="galleryIssuerFilterPanel" hidden>
            <div class="issuer-filter-columns">
              <div
                class="issuer-filter-groups"
                id="galleryIssuerFilterGroups"
                role="menu"
                aria-label="发行方(分类)"
              ></div>
              <div
                class="issuer-filter-issuers"
                id="galleryIssuerFilterIssuers"
                role="menu"
                aria-label="发行方列表"
              ></div>
            </div>
          </div>
        </div>

        <label class="select-wrap" for="galleryOrganizationFilter">
          <span>卡组织</span>
          <select id="galleryOrganizationFilter">
            <option value="all">全部卡组织</option>
          </select>
        </label>

        <div
          class="select-wrap issuer-filter region-filter"
          id="galleryRegionFilterWrap"
        >
          <span>发行方(地区)</span>
          <button
            class="issuer-filter-trigger"
            id="galleryRegionFilterTrigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span id="galleryRegionFilterLabel">全部</span>
          </button>
          <div
            class="issuer-filter-panel region-filter-panel"
            id="galleryRegionFilterPanel"
            hidden
          >
            <div class="issuer-filter-columns">
              <div
                class="issuer-filter-groups"
                id="galleryRegionFilterGroups"
                role="menu"
                aria-label="发行方(地区)"
              ></div>
              <div
                class="issuer-filter-issuers"
                id="galleryRegionFilterProvinces"
                role="menu"
                aria-label="省份或发行方列表"
              ></div>
              <div
                class="issuer-filter-issuers region-filter-bank-column"
                id="galleryRegionFilterIssuers"
                role="menu"
                aria-label="发行方列表"
              ></div>
            </div>
          </div>
        </div>

        <label class="select-wrap" for="galleryTypeFilter">
          <span>卡类型</span>
          <select id="galleryTypeFilter">
            <option value="all">全部</option>
            <option value="Debit">Debit</option>
            <option value="Credit">Credit</option>
            <option value="Prepaid">Prepaid</option>
            <option value="Transit">Transit</option>
          </select>
        </label>
      </section>

      <section
        id="galleryGrid"
        class="gallery-grid"
        aria-live="polite"
      ></section>
      <nav class="gallery-pagination" aria-label="卡片分页">
        <button
          id="galleryPreviousPage"
          class="gallery-page-button"
          type="button"
          aria-label="上一页"
          title="上一页"
        >
          ←
        </button>
        <span id="galleryPageLabel" aria-live="polite">第 1 页</span>
        <button
          id="galleryNextPage"
          class="gallery-page-button"
          type="button"
          aria-label="下一页"
          title="下一页"
        >
          →
        </button>
        <label class="gallery-page-size">
          <span>每页</span>
          <select id="galleryPageSize" aria-label="每页显示数量">
            <option value="12" selected>12</option>
            <option value="20">20</option>
            <option value="60">60</option>
            <option value="200">200</option>
            <option value="1000">1000</option>
          </select>
        </label>
      </nav>
      <div id="galleryEmpty" class="gallery-empty" hidden>
        没有符合筛选条件的卡片。
      </div>
    </main>

    <dialog id="galleryEditor" class="gallery-editor">
      <form id="galleryEditorForm" method="dialog">
        <div class="gallery-editor-preview">
          <img id="galleryEditorImage" alt="" />
        </div>
        <div class="gallery-editor-header">
          <div>
            <h2 id="galleryEditorTitle">编辑卡片</h2>
          </div>
          <button
            class="gallery-icon-button"
            id="galleryEditorClose"
            type="button"
            aria-label="关闭"
            title="关闭"
          >
            ×
          </button>
        </div>
        <div class="gallery-editor-fields">
          <label
            >卡片名称<input name="name" type="text" maxlength="500" required
          /></label>
          <label>卡 BIN<input name="bin" type="text" maxlength="100" /></label>
          <div class="gallery-editor-issuer-field">
            <label for="galleryEditorIssuer">发行方</label>
            <input
              id="galleryEditorIssuer"
              name="issuer"
              type="search"
              maxlength="300"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="galleryEditorIssuerSuggestions"
            />
            <div
              id="galleryEditorIssuerSuggestions"
              class="gallery-issuer-suggestions"
              role="listbox"
              hidden
            ></div>
          </div>
          <label>卡组织<select name="organization"></select></label>
          <label>卡等级<select name="tier"></select></label>
          <label>卡类型<select name="type"></select></label>
          <label
            >卡号位数<input name="length" type="text" maxlength="30"
          /></label>
          <div class="gallery-editor-currency">
            <span class="gallery-editor-field-label">货币</span>
            <div
              id="galleryEditorCurrency"
              class="gallery-currency-options"
              role="group"
              aria-label="货币"
            ></div>
          </div>
          <label class="gallery-editor-wide"
            >描述<textarea name="desc" rows="3" maxlength="5000"></textarea>
          </label>
          <label class="gallery-editor-wide"
            >权益<textarea name="benefit" rows="3" maxlength="5000"></textarea>
          </label>
          <label
            >外汇手续费<input name="ftf" type="text" maxlength="300"
          /></label>
        </div>
        <div
          id="galleryTurnstile"
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAD9e5HKGv1SdVtar"
          data-action="turnstile-spin-v2"
        ></div>
        <p
          id="galleryEditorStatus"
          class="gallery-editor-status"
          role="status"
          aria-live="polite"
        ></p>
        <div class="gallery-editor-actions">
          <button
            class="button secondary"
            id="galleryEditorCancel"
            type="button"
          >
            取消
          </button>
          <button class="button" id="galleryEditorSave" type="submit">
            保存
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="galleryLightbox" class="gallery-lightbox">
      <button
        id="galleryLightboxClose"
        class="gallery-lightbox-close"
        type="button"
        aria-label="关闭全屏图片"
        title="关闭"
      >
        ×
      </button>
      <button
        id="galleryLightboxPrevious"
        class="gallery-lightbox-nav gallery-lightbox-nav-prev"
        type="button"
        aria-label="上一张卡面"
        title="上一张"
      >
        ‹
      </button>
      <button
        id="galleryLightboxNext"
        class="gallery-lightbox-nav gallery-lightbox-nav-next"
        type="button"
        aria-label="下一张卡面"
        title="下一张"
      >
        ›
      </button>
      <figure class="gallery-lightbox-figure">
        <img
          id="galleryLightboxImage"
          alt=""
          loading="eager"
          decoding="async"
        />
        <figcaption
          id="galleryLightboxMeta"
          class="gallery-lightbox-meta"
        ></figcaption>
        <div
          id="galleryLightboxThumbs"
          class="gallery-lightbox-thumbs"
          role="list"
          aria-label="卡面图片"
        ></div>
      </figure>
    </dialog>

    <div id="siteFooter"></div>
    <script src="js/card-config.js"></script>
    <script src="js/common.js"></script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script src="js/gallery.js"></script>
  </body>
</html>
