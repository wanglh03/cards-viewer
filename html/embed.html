<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef1f4;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      iframe {
        display: block;
        width: 100%;
        max-width: 100vw;
        height: 100vh;
        border: 0;
        background: #fff;
      }

      #status {
        max-width: min(32rem, calc(100vw - 2rem));
        padding: 1rem 1.25rem;
        color: #29313a;
        background: #fff;
        border: 1px solid #d5dbe1;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 2rem rgb(32 42 52 / 12%);
      }
    </style>
  </head>
  <body>
    <p id="status" hidden></p>
    <iframe id="embeddedPage" title="Embedded page" hidden></iframe>

    <script>
      const params = new URLSearchParams(window.location.search);
      const status = document.getElementById("status");
      const frame = document.getElementById("embeddedPage");

      function showError(message) {
        status.textContent = message;
        status.hidden = false;
      }

      function normalizeWidth(value) {
        const raw = String(value || "100%").trim();
        if (/^\d+(?:\.\d+)?$/.test(raw)) return `${raw}px`;
        if (/^\d+(?:\.\d+)?(?:px|%|vw|rem|em|ch|vmin|vmax)$/.test(raw)) return raw;
        return "100%";
      }

      const rawUrl = params.get("url");
      const rawHash = window.location.hash;
      const widthSuffix = rawHash.match(/&width=([^&]*)$/);
      const targetHash = widthSuffix ? rawHash.slice(0, widthSuffix.index) : rawHash;
      const width = params.get("width") || (widthSuffix ? decodeURIComponent(widthSuffix[1]) : "");
      if (!rawUrl) {
        showError("缺少 url 参数");
      } else {
        try {
          const targetValue = rawUrl.includes("#") ? rawUrl : `${rawUrl}${targetHash}`;
          const target = new URL(targetValue, window.location.href);
          if (!["http:", "https:"].includes(target.protocol)) {
            throw new Error("Unsupported protocol");
          }
          frame.src = target.href;
          frame.style.width = normalizeWidth(width);
          frame.title = target.href;
          frame.hidden = false;
          document.title = target.hostname || "Embed";
        } catch {
          showError("url 参数必须是有效的网页地址");
        }
      }
    </script>
  </body>
</html>
